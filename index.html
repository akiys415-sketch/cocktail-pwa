<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cocktail Recipes</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div class="app-container">

    <!-- 左側：レシピ一覧 -->
    <aside class="sidebar">

      <header class="sidebar-header">
        <h1>🍸 カクテルリスト</h1>
      </header>

      <div class="search-area">
        <input
          id="search-input"
          type="search"
          placeholder="カクテル名、材料などで検索..."
        >

        <button id="search-button" type="button">
          検索
        </button>
      </div>

      <div class="list-area">

        <div class="kana-filter">
          <button data-kana="all" class="active">ALL</button>
          <button data-kana="ア">ア</button>
          <button data-kana="カ">カ</button>
          <button data-kana="サ">サ</button>
          <button data-kana="タ">タ</button>
          <button data-kana="ナ">ナ</button>
          <button data-kana="ハ">ハ</button>
          <button data-kana="マ">マ</button>
          <button data-kana="ヤ">ヤ</button>
          <button data-kana="ラ">ラ</button>
          <button data-kana="ワ">ワ</button>
        </div>

        <div class="recipe-list-area">
          <p id="status">レシピを読み込み中...</p>
          <div id="recipe-list"></div>
        </div>

      </div>

    </aside>


    <!-- 右側：選択したレシピの詳細 -->
    <main class="detail-panel">

      <div id="recipe-detail" class="recipe-detail">

        <div class="detail-placeholder">
          カクテルを選択してください
        </div>

      </div>

    </main>

  </div>


  <script src="app.js"></script>

</body>
</html>
